name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  ci:
    # kart-conventions.md: "CI: service repos call the reusable workflow published from kart-devops."
    uses: kart-commerce/kart-devops/.github/workflows/dotnet-service-ci.yml@main
    with:
      dotnet-version: "8.0.x"
      solution-path: KartCategoryService.sln

  migration-bundle:
    name: Migration bundle (build + smoke check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker build smoke check
        run: docker build -f Dockerfile.migrate -t ci-migrate-smoke-check:${{ github.sha }} .
